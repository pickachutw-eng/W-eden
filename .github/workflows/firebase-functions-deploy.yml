name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches:
      - agent/best-costume-voting
    paths:
      - ".github/workflows/firebase-functions-deploy.yml"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: firebase-functions-w-eden
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-production

    steps:
      - name: Check deployment configuration
        env:
          ENABLE_FIREBASE_DEPLOY: ${{ vars.ENABLE_FIREBASE_DEPLOY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_W_EDEN }}
        run: |
          test "$ENABLE_FIREBASE_DEPLOY" = "true"
          test -n "$FIREBASE_SERVICE_ACCOUNT"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix functions

      - name: Run tests
        run: npm test --prefix functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_W_EDEN }}
          project_id: w-eden

      - name: Prepare public function parameters
        run: printf '%s\n' 'LINE_CHANNEL_ID=2010878499' > functions/.env.w-eden

      - name: Deploy Cloud Functions
        run: npx --yes firebase-tools@latest deploy --only functions --project w-eden --non-interactive --force

      - name: Report deployment result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            const branch = context.ref.replace('refs/heads/', '');
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
              per_page: 100
            });
            if (!pulls.length) {
              core.info(`No open pull request found for ${branch}; skipping PR comment.`);
              return;
            }
            const issueNumber = pulls[0].number;
            const marker = '<!-- firebase-functions-deploy-result -->';
            const body = `${marker}\n${succeeded ? '✅' : '❌'} Firebase Functions deployment ${succeeded ? 'succeeded' : 'failed'} for commit \`${context.sha.slice(0, 7)}\`.\n\n[View GitHub Actions run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
            }
